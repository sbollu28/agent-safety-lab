[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agent-safety-lab"
version = "0.2.0"
description = "Synthetic offline network-agent safety and policy automation demonstrations"
readme = "README.md"
requires-python = ">=3.10"
[project.scripts]
agent-safety-lab = "agent_safety_lab.cli:main"
agent-policy-demo = "agent_safety_lab.platform_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
